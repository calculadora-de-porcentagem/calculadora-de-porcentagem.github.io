name: Deploy Hugo ke GitHub Pages

on:
  push:
    branches:
      - master          # ganti ke "master" jika branch utama Anda bernama master
  workflow_dispatch:  # izinkan trigger manual dari tab Actions

# Izin yang diperlukan untuk men-deploy ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Hanya satu deployment yang berjalan bersamaan
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default shell
defaults:
  run:
    shell: bash

jobs:
  # ── Build ────────────────────────────────────────────────────────────────────
  build:
    name: Build Hugo
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.161.1
    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4
        with:
          submodules: recursive   # ambil tema yang menjadi submodule
          fetch-depth: 0          # diperlukan untuk .GitInfo dan .Lastmod

      - name: Install Hugo v${{ env.HUGO_VERSION }} (extended)
        run: |
          curl -Lo hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz hugo
          sudo mv hugo /usr/local/bin/hugo
          hugo version

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Hugo
        # HUGO_ENVIRONMENT = production agar template production-only aktif
        env:
          HUGO_ENVIRONMENT: production
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public   # direktori output default Hugo

  # ── Deploy ───────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy ke GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
